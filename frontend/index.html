<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#15803d" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ShopX — Official Supermall & Smart Commerce</title>
    <meta name="description" content="ShopX — Bangladesh's Premier Official Supermall & Smart Multi-Vendor Commerce Platform. 100% Genuine Brands, BSTI Certified Organic Foods & 24h Express Delivery." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8fafc] text-slate-800 font-sans antialiased selection:bg-emerald-600 selection:text-white pb-16 md:pb-0">
    <div id="root"></div>
    <script>
      // Suppress noisy browser extension errors (e.g. LastPass, MetaMask, React DevTools runtime ports)
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('Receiving end does not exist') || e.message.includes('Could not establish connection'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (String(e.reason).includes('Receiving end does not exist') || String(e.reason).includes('Could not establish connection'))) {
          e.preventDefault();
        }
      });
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
